# Publishes the site to GitHub Pages after every push to main.
# The site has no build step, so this only copies the repository's files.
# One-time setup by the repository owner: Settings > Pages > Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Adds a "Run workflow" button on the Actions tab for a manual redeploy.
  workflow_dispatch:

# The least access the job needs: read the code, publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A deploy that has started is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Read the Pages settings
        uses: actions/configure-pages@v6
      - name: Package the site
        uses: actions/upload-pages-artifact@v5
        with:
          # Whole repository. .git, .github and other dot-files are left out.
          path: .
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
